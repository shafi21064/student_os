name: studentos
version: 1.1.1+3
publish_to: none
description: A production-structured Flutter conversion of the StudentOS student super-app prototype.

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/reference/
    - assets/branding/
    - assets/icons/

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  file_picker: 10.3.10
  flutter_dotenv: ^6.0.0

  # Firebase
  firebase_core: ^3.12.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  dio: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
